<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BamboWorld - Магазин</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0d0f12;
            --bg-card: rgba(22, 26, 33, 0.85);
            --accent-green: #2ecc71;
            --accent-green-hover: #27ae60;
            --text-main: #ffffff;
            --text-muted: #a0aab8;
            --border-color: rgba(255, 255, 255, 0.08);
            --card-glow: rgba(46, 204, 113, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(46, 204, 113, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(46, 204, 113, 0.05) 0%, transparent 40%);
        }

        header {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span {
            color: var(--accent-green);
        }

        .lang-switch {
            display: flex;
            gap: 10px;
            background: var(--bg-card);
            padding: 6px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .lang-btn.active {
            background: var(--accent-green);
            color: #000;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* Перемикач вкладок (Привілегії / Валюта) */
        .tabs-container {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .tab-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tab-btn.active {
            background: var(--accent-green);
            color: #000;
            border-color: var(--accent-green);
            box-shadow: 0 0 15px var(--card-glow);
        }

        .roles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .role-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .role-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-green);
            box-shadow: 0 10px 20px var(--card-glow);
        }

        .role-card.selected {
            border-color: var(--accent-green);
            background: rgba(46, 204, 113, 0.08);
            box-shadow: 0 0 25px var(--card-glow);
        }

        .role-icon {
            font-size: 36px;
            margin-bottom: 15px;
            color: var(--accent-green);
        }

        .role-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .role-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-green);
        }

        /* Панель купівлі валюти */
        .coins-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            display: none;
            flex-direction: column;
            gap: 20px;
            backdrop-filter: blur(10px);
        }

        .coins-panel.active {
            display: flex;
        }

        .checkout-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: fit-content;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 20px;
        }

        .checkout-title {
            font-size: 20px;
            font-weight: 800;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .input-group input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--accent-green);
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            color: var(--text-muted);
        }

        .summary-item.total {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-main);
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .summary-item.total span:last-child {
            color: var(--accent-green);
        }

        .pay-btn {
            background: var(--accent-green);
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .pay-btn:hover {
            background: var(--accent-green-hover);
            transform: scale(1.02);
        }

        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
        }

        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-green);
            padding: 15px 20px;
            border-radius: 10px;
            color: var(--text-main);
            font-weight: 600;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            animation: slideIn 0.3s ease forwards;
        }

        .toast.error {
            border-left-color: #e74c3c;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-cubes"></i> BAMBO<span>WORLD</span>
        </div>
        <div class="lang-switch">
            <button class="lang-btn active" onclick="setLanguage('uk')">UA</button>
            <button class="lang-btn" onclick="setLanguage('en')">EN</button>
        </div>
    </header>

    <div class="container">
        <!-- Вкладки категорій -->
        <div class="tabs-container">
            <button class="tab-btn active" id="tabRanks" onclick="switchCategory('ranks')">
                <i class="fa-solid fa-crown"></i> <span id="txtTabRanks">Привілегії</span>
            </button>
            <button class="tab-btn" id="tabCoins" onclick="switchCategory('coins')">
                <i class="fa-solid fa-coins"></i> <span id="txtTabCoins">Донат Монети</span>
            </button>
        </div>

        <!-- Сітка Привілегій -->
        <div class="roles-grid" id="rolesGrid"></div>

        <!-- Панель Монет -->
        <div class="coins-panel" id="coinsPanel">
            <div class="input-group">
                <label id="txtCoinsCountLabel">Кількість монет (1 монета = 1 ₴):</label>
                <input type="number" id="coinsAmount" value="50" min="10" max="10000" oninput="updateCoinsCalculation()">
            </div>
            <div style="color: var(--text-muted); font-size: 14px;">
                💡 Монети відразу після покупки зараховуються на ваш ігровий баланс.
            </div>
        </div>

        <!-- Панель Оформлення -->
        <div class="checkout-panel">
            <div class="checkout-title" id="txtCheckoutTitle">Оформлення покупки</div>
            
            <div class="input-group">
                <label id="txtNickLabel">Нікнейм у Minecraft</label>
                <input type="text" id="playerNickname" placeholder="Введіть ваш нік..." autocomplete="off">
            </div>

            <div class="summary-item">
                <span id="txtSelectedRoleLabel">Товар:</span>
                <span id="selectedRoleName">-</span>
            </div>

            <div class="summary-item total">
                <span id="txtTotalLabel">До сплати:</span>
                <span id="selectedRolePrice">0 ₴</span>
            </div>

            <button class="pay-btn" onclick="processPayment()">
                <i class="fa-solid fa-credit-card"></i> <span id="txtPayBtn">Оплатити</span>
            </button>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        const roles = [
            { id: "PREMIUM", name: "PREMIUM", price: 15, icon: "fa-crown" },
            { id: "BAMA", name: "BAMA", price: 30, icon: "fa-shield-halved" },
            { id: "BAMBOO", name: "BAMBOO", price: 50, icon: "fa-bolt" },
            { id: "SUMMER", name: "SUMMER", price: 100, icon: "fa-sun" },
            { id: "BILDER", name: "BILDER", price: 150, icon: "fa-hammer" }
        ];

        let activeCategory = 'ranks'; // 'ranks' або 'coins'
        let selectedRole = roles[0];
        let coinPricePerItem = 1; // 1 монета = 1 грн
        let currentLang = 'uk';

        const translations = {
            uk: {
                tabRanks: "Привілегії",
                tabCoins: "Донат Монети",
                coinsCountLabel: "Кількість монет (1 монета = 1 ₴):",
                checkoutTitle: "Оформлення покупки",
                nickLabel: "Нікнейм у Minecraft",
                nickPlaceholder: "Введіть ваш нік...",
                selectedRoleLabel: "Товар:",
                totalLabel: "До сплати:",
                payBtn: "Оплатити",
                toastEnterNick: "Будь ласка, вкажіть ваш нікнейм!",
                toastRedirectPay: "Перенаправлення на оплату..."
            },
            en: {
                tabRanks: "Ranks",
                tabCoins: "Donate Coins",
                coinsCountLabel: "Coins amount (1 coin = 1 ₴):",
                checkoutTitle: "Checkout",
                nickLabel: "Minecraft Nickname",
                nickPlaceholder: "Enter your nickname...",
                selectedRoleLabel: "Item:",
                totalLabel: "Total:",
                payBtn: "Pay Now",
                toastEnterNick: "Please enter your nickname!",
                toastRedirectPay: "Redirecting to payment..."
            }
        };

        function switchCategory(category) {
            activeCategory = category;
            
            document.getElementById('tabRanks').classList.toggle('active', category === 'ranks');
            document.getElementById('tabCoins').classList.toggle('active', category === 'coins');

            if (category === 'ranks') {
                document.getElementById('rolesGrid').style.display = 'grid';
                document.getElementById('coinsPanel').classList.remove('active');
                updateSummary();
            } else {
                document.getElementById('rolesGrid').style.display = 'none';
                document.getElementById('coinsPanel').classList.add('active');
                updateCoinsCalculation();
            }
        }

        function renderRoles() {
            const grid = document.getElementById('rolesGrid');
            grid.innerHTML = '';

            roles.forEach(role => {
                const card = document.createElement('div');
                card.className = `role-card ${role.id === selectedRole.id ? 'selected' : ''}`;
                card.onclick = () => selectRole(role);

                card.innerHTML = `
                    <i class="fa-solid ${role.icon} role-icon"></i>
                    <div class="role-title">${role.name}</div>
                    <div class="role-price">${role.price} ₴</div>
                `;
                grid.appendChild(card);
            });

            updateSummary();
        }

        function selectRole(role) {
            selectedRole = role;
            renderRoles();
        }

        function updateSummary() {
            if (activeCategory === 'ranks') {
                document.getElementById('selectedRoleName').innerText = selectedRole.name;
                document.getElementById('selectedRolePrice').innerText = `${selectedRole.price} ₴`;
            }
        }

        function updateCoinsCalculation() {
            let amount = parseInt(document.getElementById('coinsAmount').value) || 0;
            if (amount < 1) amount = 1;
            const totalPrice = amount * coinPricePerItem;

            document.getElementById('selectedRoleName').innerText = `${amount} Монет`;
            document.getElementById('selectedRolePrice').innerText = `${totalPrice} ₴`;
        }

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const t = translations[lang];
            document.getElementById('txtTabRanks').innerText = t.tabRanks;
            document.getElementById('txtTabCoins').innerText = t.tabCoins;
            document.getElementById('txtCoinsCountLabel').innerText = t.coinsCountLabel;
            document.getElementById('txtCheckoutTitle').innerText = t.checkoutTitle;
            document.getElementById('txtNickLabel').innerText = t.nickLabel;
            document.getElementById('playerNickname').placeholder = t.nickPlaceholder;
            document.getElementById('txtSelectedRoleLabel').innerText = t.selectedRoleLabel;
            document.getElementById('txtTotalLabel').innerText = t.totalLabel;
            document.getElementById('txtPayBtn').innerText = t.payBtn;
        }

        function showToast(message, type = "success") {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            container.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        function processPayment() {
            const nickInput = document.getElementById('playerNickname').value.trim();
            if (!nickInput) {
                showToast(translations[currentLang].toastEnterNick, "error");
                document.getElementById('playerNickname').focus();
                return;
            }

            showToast(translations[currentLang].toastRedirectPay, "success");

            setTimeout(() => {
                if (activeCategory === 'ranks') {
                    // Перехід на магазин привілегії
                    window.location.href = `https://minepay.store/${selectedRole.id.toLowerCase()}?username=${encodeURIComponent(nickInput)}`;
                } else {
                    // Перехід на покупку монет (якщо ви створите окремий магазин "coins" у MinePay)
                    const coinsAmount = document.getElementById('coinsAmount').value;
                    window.location.href = `https://minepay.store/coins?username=${encodeURIComponent(nickInput)}&quantity=${coinsAmount}`;
                }
            }, 800);
        }

        // Ініціалізація
        renderRoles();
    </script>
</body>
</html>
