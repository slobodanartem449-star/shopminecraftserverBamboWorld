<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BamboWorld — Донат</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0b0f0c;
            color: #ffffff;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .donate-card {
            background: rgba(18, 26, 20, 0.85);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 550px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .block-title {
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            text-align: center;
            color: #fff;
            margin-bottom: 6px;
        }

        .block-subtitle {
            color: #71717a;
            font-size: 14px;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #71717a;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus, .form-select:focus {
            border-color: #10b981;
        }

        .form-select option {
            background: #121a14;
            color: #fff;
        }

        /* Перемикач типом покупки */
        .type-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .type-btn {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #a0a0a0;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }

        .type-btn.active {
            background: #10b981;
            border-color: #10b981;
            color: #000;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        }

        .preset-buttons {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .preset-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 8px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .preset-btn:hover {
            background: rgba(16, 185, 129, 0.2);
            border-color: #10b981;
        }

        .total-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 25px 0 15px 0;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .total-label {
            color: #a1a1aa;
            font-size: 16px;
        }

        .total-amount {
            font-size: 32px;
            font-weight: 800;
            color: #10b981;
        }

        .btn-buy {
            display: block;
            width: 100%;
            padding: 16px;
            background: #10b981;
            color: #000;
            text-align: center;
            text-decoration: none;
            font-weight: 800;
            border-radius: 10px;
            font-size: 17px;
            border: none;
            cursor: pointer;
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-buy:hover {
            background: #34d399;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }
    </style>
</head>
<body>

<div class="donate-card">
    <div class="block-title">💳 ПОПОВНЕННЯ ТА ДОНАТ</div>
    <div class="block-subtitle">Вкажи свій нікнейм та обери товар для покупки</div>

    <!-- Перемикач типу: Привілегія або Бамбук -->
    <div class="type-selector">
        <button class="type-btn active" id="btn-rank" onclick="selectType('rank')">👑 ПРИВІЛЕГІЇ</button>
        <button class="type-btn" id="btn-currency" onclick="selectType('currency')">🎋 ВАЛЮТА БАМБУК</button>
    </div>

    <!-- Поле введення ніку -->
    <div class="form-group">
        <label class="form-label">Ігровий нікнейм</label>
        <input type="text" id="player-nick" class="form-input" placeholder="Введи свій нік...">
    </div>

    <!-- Блок вибору привілегій -->
    <div id="ranks-section" class="form-group">
        <label class="form-label">Обери привілегію</label>
        <select id="rank-select" class="form-select" onchange="updatePrice()">
            <option value="50">PREMIUM — 50 ГРН</option>
            <option value="100">BAMBOO — 100 ГРН</option>
            <option value="150">SUMMER — 150 ГРН</option>
            <option value="200">BILDER — 200 ГРН</option>
        </select>
    </div>

    <!-- Блок вибору валюти Бамбук (захований за замовчуванням) -->
    <div id="currency-section" class="form-group" style="display: none;">
        <label class="form-label">Кількість Бамбука</label>
        <input type="number" id="bamboo-count" class="form-input" value="50" min="1" oninput="updatePrice()">
        
        <div class="preset-buttons">
            <button class="preset-btn" onclick="setAmount(10)">10</button>
            <button class="preset-btn" onclick="setAmount(50)">50</button>
            <button class="preset-btn" onclick="setAmount(100)">100</button>
            <button class="preset-btn" onclick="setAmount(250)">250</button>
            <button class="preset-btn" onclick="setAmount(500)">500</button>
        </div>
    </div>

    <!-- Підсумок ціни -->
    <div class="total-box">
        <span class="total-label">До сплати:</span>
        <div>
            <span id="final-price" class="total-amount">50</span>
            <span style="color: #10b981; font-weight: 800;">ГРН</span>
        </div>
    </div>

    <!-- Кнопка перехода на MinePay -->
    <a href="https://minepay.store/bamboworld" target="_blank" class="btn-buy">
        ⚡ ПЕРЕЙТИ ДО ОПЛАТИ
    </a>
</div>

<script>
    let currentType = 'rank';

    function selectType(type) {
        currentType = type;
        const rankBtn = document.getElementById('btn-rank');
        const currBtn = document.getElementById('btn-currency');
        const rankSec = document.getElementById('ranks-section');
        const currSec = document.getElementById('currency-section');

        if (type === 'rank') {
            rankBtn.classList.add('active');
            currBtn.classList.remove('active');
            rankSec.style.display = 'block';
            currSec.style.display = 'none';
        } else {
            currBtn.classList.add('active');
            rankBtn.classList.remove('active');
            rankSec.style.display = 'none';
            currSec.style.display = 'block';
        }
        updatePrice();
    }

    function updatePrice() {
        const priceDisplay = document.getElementById('final-price');
        if (currentType === 'rank') {
            const rankSelect = document.getElementById('rank-select');
            priceDisplay.innerText = rankSelect.value;
        } else {
            const input = document.getElementById('bamboo-count');
            let val = parseInt(input.value) || 0;
            if (val < 0) val = 0;
            priceDisplay.innerText = val;
        }
    }

    function setAmount(amount) {
        document.getElementById('bamboo-count').value = amount;
        updatePrice();
    }
</script>

</body>
</html>
